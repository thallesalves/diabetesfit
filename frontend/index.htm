<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DiabetesFit – Avaliador de Segurança no Treino</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>DiabetesFit</h1>

      <p>Verifique se é seguro iniciar seu treino</p>
    </header>

    <main>
      <form id="formAvaliacao">
        <label for="glicemia"> Glicemia pré-treino: </label>

        <input
          type="number"
          id="glicemia"
          name="glicemia"
          placeholder="Ex: 120"
          required
        />

        <label for="insulina"> Insulina rápida ativa: </label>

        <input
          type="number"
          id="insulina"
          name="insulina"
          step="0.1"
          placeholder="Ex: 1.5"
          required
        />

        <label for="horarioInsulina">
          Última aplicação de insulina rápida:
        </label>

        <input
          type="time"
          id="horarioInsulina"
          name="horarioInsulina"
          required
        />

        <label for="treino"> Tipo de treino: </label>

        <select id="treino" name="treino" required>
          <option value="">Escolha o exercício</option>

          <option value="musculacao">Musculação</option>

          <option value="crossfit">CrossFit</option>

          <option value="corrida">Corrida</option>

          <option value="natacao">Natação</option>

          <option value="ciclismo">Ciclismo</option>
        </select>

        <button type="submit">Avaliar Segurança</button>
      </form>

      <section id="resultado" class="oculto" aria-live="polite"></section>

      <section id="historySection">
        <section id="statisticsSection"></section>

        <div class="history-header">
          <h2>Histórico de avaliações</h2>

          <button type="button" id="clearHistoryButton">
            Limpar histórico
          </button>
        </div>

        <div id="historyList"></div>
      </section>
    </main>

    <footer>
      <p>© 2025 DiabetesFit</p>
    </footer>

    <script type="module" src="main.js"></script>
  </body>
</html>
